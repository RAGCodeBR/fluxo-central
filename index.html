<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fluxo Central</title>
  <style>
    :root{--navy:#121d2b;--ink:#172235;--muted:#6b7685;--line:#e6eaf0;--bg:#f5f7fa;--blue:#2864dc;--cyan:#16a3b5;--green:#20a76c;--amber:#d88a1e;--red:#d65050;--white:#fff}*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:254px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#d6dfec;padding:20px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;font-size:17px;font-weight:760;color:white}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2c87f0,#1ac5bd);display:grid;place-items:center;font-size:17px}.brand small{display:block;font-size:10px;font-weight:600;color:#8fa1b8;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b8c4d5;text-align:left;padding:11px 12px;border-radius:8px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#243247;color:white}.nav .ico{font-size:17px;width:19px;text-align:center}.nav-label{font-size:11px;text-transform:uppercase;color:#8190a6;font-weight:700;letter-spacing:.08em;margin:21px 11px 8px}.user{margin-top:auto;border-top:1px solid #29394d;padding:16px 10px 2px;display:flex;gap:10px;align-items:center}.avatar{height:30px;width:30px;background:#e1efff;color:#2161b4;border-radius:50%;display:grid;place-items:center;font-weight:750}.user strong,.user span{display:block}.user span{font-size:11px;color:#90a0b5;margin-top:2px}.workspace{min-width:0}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink);font-size:17px;margin-left:8px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn,.outline-btn,.primary{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;color:#435066}.primary{background:var(--blue);color:white;border-color:var(--blue);font-weight:650}.main{padding:28px 30px;max-width:1600px}.page-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:24px}.page-head h1{font-size:23px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters select,.filters input{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 10px;color:#455166}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:17px;box-shadow:0 2px 6px #1a355709}.card .label{color:var(--muted);font-size:12px}.card .value{font-size:27px;font-weight:750;margin-top:8px}.card .trend{font-size:12px;color:var(--green);margin-top:7px}.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:16px;margin-top:17px}.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:18px;min-width:0}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:730}.panel-title span{font-size:12px;color:var(--muted);font-weight:500}.chart{height:230px;display:flex;align-items:end;gap:12px;border-bottom:1px solid var(--line);padding:0 8px 19px}.bar{flex:1;background:linear-gradient(180deg,#64a0f1,#2864dc);border-radius:6px 6px 2px 2px;min-width:16px;position:relative}.bar:after{content:attr(data-day);position:absolute;top:calc(100% + 7px);color:#8c96a3;font-size:10px;left:50%;transform:translateX(-50%)}.donut-row{display:flex;align-items:center;gap:25px;height:230px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--blue) 0 42%,var(--cyan) 42% 72%,var(--amber) 72% 88%,#e3e8ee 88%);position:relative}.donut:after{content:"Canais";position:absolute;inset:34px;background:white;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.legend{display:grid;gap:11px;flex:1}.legend i{height:10px;width:10px;border-radius:50%;display:inline-block;margin-right:8px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#718095;padding:11px 12px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:12px;border-bottom:1px solid var(--line);color:#46546a}.empty{padding:42px 20px;text-align:center;color:var(--muted)}.empty .empty-ico{font-size:29px;margin-bottom:9px}.badge{border-radius:99px;padding:4px 8px;font-size:11px;font-weight:650;display:inline-block}.badge.blue{background:#e9f0ff;color:#2b63c8}.badge.green{background:#e5f7ef;color:#197548}.badge.amber{background:#fff2dc;color:#a2620e}.badge.red{background:#ffebeb;color:#b23e3e}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stack{display:grid;gap:14px}.agent{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;align-items:center;gap:11px}.agent .dot{width:9px;height:9px;background:var(--green);border-radius:50%}.agent .agent-info{flex:1}.agent strong,.agent span{display:block}.agent span{font-size:12px;color:var(--muted);margin-top:2px}.count{font-weight:750;font-size:18px}.chat-layout{display:grid;grid-template-columns:245px 1fr;gap:0;height:calc(100vh - 180px);min-height:540px}.chat-list{border-right:1px solid var(--line);overflow:auto}.conversation{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.conversation.active{background:#edf4ff;border-left:3px solid var(--blue)}.conversation strong,.conversation span{display:block}.conversation span{color:var(--muted);font-size:12px;margin-top:3px}.chat-window{display:flex;flex-direction:column;padding:18px}.chat-top{font-weight:700;border-bottom:1px solid var(--line);padding-bottom:14px}.messages{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}.composer{display:flex;gap:9px}.composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#566377;font-weight:650}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#10182780;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modal-card{width:min(610px,100%);background:white;border-radius:12px;padding:22px;box-shadow:0 24px 70px #10182744}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.modal-close{border:0;background:transparent;font-size:22px;color:var(--muted)}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:25px;bottom:25px;background:#183a2a;color:white;padding:12px 16px;border-radius:8px;display:none;box-shadow:0 9px 25px #0003}.toast.show{display:block}.hide{display:none!important}@media(max-width:900px){.app{grid-template-columns:64px 1fr}.brand span,.nav button .nav-text,.nav-label,.user div{display:none}.sidebar{padding:15px 8px}.nav button{justify-content:center;padding:11px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.two-col{grid-template-columns:1fr}.main{padding:20px}.topbar{padding:0 18px}.chat-layout{grid-template-columns:180px 1fr}}@media(max-width:580px){.app{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:1fr}.top-actions .outline-btn{display:none}.page-head{display:block}.filters{margin-top:15px}.main{padding:16px}.topbar{height:60px}.chat-layout{grid-template-columns:1fr}.chat-list{display:none}}
    /* Navegação horizontal inspirada na hierarquia observada, com identidade verde própria. */
    :root{--navy:#10231e;--line:#e4ebe8;--bg:#f5f8f6;--blue:#16855e;--cyan:#29a981}
    .app{display:block}.sidebar{height:68px;padding:0 22px;background:#10231e;display:flex;flex-direction:row;align-items:center;gap:24px;color:#d6dfec}.brand{display:flex;align-items:center;gap:10px;padding:0;white-space:nowrap;font-size:15px;font-weight:760;color:#fff}.brand>div:last-child{display:block}.brand small{display:block;font-size:9px;font-weight:600;color:#9db6aa;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}.mark{width:34px;height:34px;background:linear-gradient(135deg,#16a56d,#72c997)}.nav{display:flex;gap:6px;align-items:center;flex:1;min-width:0}.nav button{position:relative;border:0;background:#29473d;color:#d5e3dd;width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center}.nav button:hover,.nav button.active{background:#dff7e9;color:#173d30}.nav button::after{content:attr(title);position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(-3px);z-index:20;white-space:nowrap;background:#10231e;color:#fff;border:1px solid #426355;border-radius:6px;padding:7px 9px;font-size:11px;font-weight:650;box-shadow:0 5px 16px #08150f55;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}.nav button:hover::after,.nav button:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0)}.nav .ico{font-size:18px;display:grid;place-items:center}.nav .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav .nav-text{display:none}.nav-label{display:none}.user{margin:0;padding:0 0 0 14px;border:0;display:flex;gap:8px;align-items:center;border-left:1px solid #2b4b40}.user>div:last-child{display:block}.user strong{font-size:12px;color:#e7f1ec}.user span{font-size:10px;color:#9db6aa}.avatar{background:#d8f4e7;color:#137351}.workspace{min-width:0}.topbar{height:60px;padding:0 30px}.bar{background:linear-gradient(180deg,#73cfa3,#16855e)}.conversation.active{background:#ebf8f1}.badge.blue{background:#e2f6ec;color:#177552}@media(max-width:800px){.sidebar{gap:8px;padding:0 12px}.nav button{width:33px;height:33px}.user>div:last-child{display:none}.user{padding-left:8px}}@media(max-width:580px){.sidebar{height:58px;padding:0 10px}.brand>div:last-child,.nav button:nth-of-type(n+6),.user{display:none}.nav{justify-content:flex-end}.topbar{padding:0 16px}}
  </style>
</head>
<body><div class="app">
  <aside class="sidebar"><div class="brand"><div class="mark">↗</div><div>Fluxo Central<small>Gestão de atendimento</small></div></div>
    <nav class="nav"><button class="active" data-page="dashboard" title="Painel e indicadores"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span><span class="nav-text">Visão geral</span></button><button data-page="agents" title="Painel de agentes"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.1-6 8-6s7.5 2 8 6"/></svg></span><span class="nav-text">Equipe</span></button><button data-page="crm" title="CRM"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></span><span class="nav-text">CRM</span></button><button data-page="tickets" title="Tickets"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4z"/><path d="M9 8v8"/></svg></span><span class="nav-text">Tickets</span></button><button data-page="inbox" title="Atendimentos"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/></svg></span><span class="nav-text">Atendimentos</span></button><button data-page="internal" title="Chat interno"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 4h12v9H8l-5 4z"/><path d="M10 13h11v6h-5l-3 2v-2h-3z"/></svg></span><span class="nav-text">Chat interno</span></button><button data-page="contacts" title="Contatos"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-4 2.8-6 7-6s6.4 2 7 6"/></svg></span><span class="nav-text">Contatos</span></button><div class="nav-label">Análise</div><button data-page="reports" title="Relatórios"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h17"/><path d="m7 15 4-4 3 2 5-6"/></svg></span><span class="nav-text">Relatórios</span></button><button data-page="settings" title="Configurações"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.6-.7-1.6 1-1.8-2.1-2.1-1.8 1-1.6-.7L11.2 3h-3l-.6 2-.1.1-1.6.7-1.8-1-2.1 2.1 1 1.8-.7 1.6-2 .6v3l2 .6.7 1.6-1 1.8 2.1 2.1 1.8-1 1.6.7.6 2h3l.6-2 1.6-.7 1.8 1 2.1-2.1-1-1.8.7-1.6z"/></svg></span><span class="nav-text">Configurações</span></button></nav>
    <div class="user"><div class="avatar">FC</div><div><strong>Administrador</strong><span>Ambiente inicial</span></div></div></aside>
  <section class="workspace"><header class="topbar"><div class="crumb">Fluxo Central <b id="crumb">Visão geral</b></div><div class="top-actions"><button class="icon-btn" title="Notificações">♧</button><button class="outline-btn" data-action="export">Exportar</button><button class="primary" id="newAction">+ Novo</button></div></header><main class="main" id="content"></main></section>
</div><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Novo registro</h2><button class="modal-close" id="modalClose">×</button></div><form id="modalForm"></form></div></div><div class="toast" id="toast"></div>
<script>
const db={contacts:JSON.parse(localStorage.getItem('fc.contacts')||'[]'),tickets:JSON.parse(localStorage.getItem('fc.tickets')||'[]'),deals:JSON.parse(localStorage.getItem('fc.deals')||'[]'),agents:JSON.parse(localStorage.getItem('fc.agents')||'[]')};
const pageNames={dashboard:'Visão geral',agents:'Equipe',crm:'CRM',tickets:'Tickets',inbox:'Atendimentos',internal:'Chat interno',contacts:'Contatos',reports:'Relatórios',settings:'Configurações'};let current='dashboard';
function save(){for(const k in db)localStorage.setItem('fc.'+k,JSON.stringify(db[k]));}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function empty(label,action){return `<div class="empty"><div class="empty-ico">◌</div><strong>Nenhum ${label} ainda</strong><div style="margin:6px 0 16px">Este ambiente começa vazio, pronto para a sua operação.</div><button class="primary" onclick="openForm('${action}')">Adicionar ${label}</button></div>`}
function cards(){const total=db.contacts.length, open=db.tickets.filter(x=>x.status!=='Resolvido').length, deals=db.deals.length;return `<div class="cards"><div class="card"><div class="label">Atendimentos</div><div class="value">0</div><div class="trend">Aguardando operação</div></div><div class="card"><div class="label">Contatos cadastrados</div><div class="value">${total}</div><div class="trend">Base própria</div></div><div class="card"><div class="label">Tickets em aberto</div><div class="value">${open}</div><div class="trend">Fila atual</div></div><div class="card"><div class="label">Oportunidades</div><div class="value">${deals}</div><div class="trend">Pipeline comercial</div></div></div>`}
function dashboard(){return `<div class="page-head"><div><h1>Visão geral</h1><p>Acompanhe o ritmo da sua operação em tempo real.</p></div><div class="filters"><select><option>Todos os canais</option><option>WhatsApp</option><option>Instagram</option><option>Telefone</option></select><select><option>Hoje</option><option>Últimos 7 dias</option><option>Este mês</option></select></div></div>${cards()}<div class="grid2"><section class="panel"><div class="panel-title">Volume de atendimentos <span>últimos 7 dias</span></div><div class="chart">${[24,40,30,62,48,72,58].map((x,i)=>`<div class="bar" style="height:${x}%" data-day="${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}"></div>`).join('')}</div></section><section class="panel"><div class="panel-title">Origem dos contatos <span>sem dados</span></div><div class="donut-row"><div class="donut"></div><div class="legend"><div><i style="background:#2864dc"></i>Mensagens</div><div><i style="background:#16a3b5"></i>Telefone</div><div><i style="background:#d88a1e"></i>Formulários</div><div><i style="background:#e3e8ee"></i>Outros</div></div></div></section></div><section class="panel" style="margin-top:16px"><div class="panel-title">Desempenho da equipe <span>será preenchido conforme a equipe operar</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Agente</th><th>Atendimentos</th><th>Resoluções</th><th>Tempo médio</th><th>Status</th></tr></thead><tbody>${db.agents.length?db.agents.map(a=>`<tr><td>${esc(a.name)}</td><td>0</td><td>0</td><td>—</td><td><span class="badge green">Disponível</span></td></tr>`).join(''):`<tr><td colspan="5">${empty('agente','agent')}</td></tr>`}</tbody></table></div></section>`}
function agents(){return `<div class="page-head"><div><h1>Equipe</h1><p>Disponibilidade, carga e desempenho dos seus agentes.</p></div><button class="primary" onclick="openForm('agent')">+ Adicionar agente</button></div><div class="cards"><div class="card"><div class="label">Disponíveis</div><div class="value">${db.agents.length}</div><div class="trend">Equipe ativa</div></div><div class="card"><div class="label">Em atendimento</div><div class="value">0</div><div class="trend">Agora</div></div><div class="card"><div class="label">Em pausa</div><div class="value">0</div><div class="trend">Agora</div></div><div class="card"><div class="label">Desconectados</div><div class="value">0</div><div class="trend">Agora</div></div></div><section class="panel" style="margin-top:16px"><div class="panel-title">Agentes cadastrados <span>${db.agents.length} total</span></div>${db.agents.length?`<div class="two-col">${db.agents.map(a=>`<div class="agent"><div class="avatar">${esc(a.name.slice(0,2).toUpperCase())}</div><div class="agent-info"><strong>${esc(a.name)}</strong><span>${esc(a.role||'Atendimento')}</span></div><div class="dot"></div><span class="badge green">Disponível</span></div>`).join('')}</div>`:empty('agente','agent')}</section>`}
function contacts(){return `<div class="page-head"><div><h1>Contatos</h1><p>Centralize clientes, empresas e histórico de relacionamento.</p></div><button class="primary" onclick="openForm('contact')">+ Novo contato</button></div><section class="panel"><div class="filters" style="margin-bottom:14px"><input placeholder="Buscar por nome, telefone ou e-mail" id="contactSearch" oninput="filterContacts()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Origem</th><th>Cadastro</th></tr></thead><tbody id="contactRows">${contactRows()}</tbody></table></div></section>`}function contactRows(list=db.contacts){return list.length?list.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td><span class="badge blue">${esc(c.channel||'Manual')}</span></td><td>${c.date}</td></tr>`).join(''):`<tr><td colspan="5">${empty('contato','contact')}</td></tr>`}function filterContacts(){const v=document.querySelector('#contactSearch').value.toLowerCase();document.querySelector('#contactRows').innerHTML=contactRows(db.contacts.filter(c=>Object.values(c).join(' ').toLowerCase().includes(v)))}
function tickets(){return `<div class="page-head"><div><h1>Tickets</h1><p>Organize solicitações, responsáveis e níveis de prioridade.</p></div><button class="primary" onclick="openForm('ticket')">+ Novo ticket</button></div><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Assunto</th><th>Solicitante</th><th>Prioridade</th><th>Status</th><th>Criado em</th></tr></thead><tbody>${db.tickets.length?db.tickets.map(t=>`<tr><td><strong>${esc(t.subject)}</strong></td><td>${esc(t.requester)}</td><td><span class="badge ${t.priority==='Alta'?'red':t.priority==='Média'?'amber':'blue'}">${t.priority}</span></td><td><span class="badge ${t.status==='Resolvido'?'green':'blue'}">${t.status}</span></td><td>${t.date}</td></tr>`).join(''):`<tr><td colspan="5">${empty('ticket','ticket')}</td></tr>`}</tbody></table></div></section>`}
function crm(){const stages=['Novo','Em contato','Qualificado','Proposta','Concluído'];return `<div class="page-head"><div><h1>CRM</h1><p>Visualize e avance oportunidades pelo funil comercial.</p></div><button class="primary" onclick="openForm('deal')">+ Nova oportunidade</button></div><div class="grid2" style="grid-template-columns:repeat(5,minmax(190px,1fr));align-items:start">${stages.map(s=>`<section class="panel" style="padding:12px"><div class="panel-title">${s}<span>${db.deals.filter(d=>d.stage===s).length}</span></div><div class="stack">${db.deals.filter(d=>d.stage===s).map(d=>`<div class="agent" style="display:block"><strong>${esc(d.name)}</strong><span>${esc(d.company||'Sem empresa')}</span><div style="margin-top:10px"><button class="outline-btn" style="padding:5px 8px;font-size:11px" onclick="advanceDeal('${d.id}')">Avançar →</button></div></div>`).join('')||`<div style="padding:15px 4px;color:var(--muted);font-size:12px">Nenhuma oportunidade</div>`}</div></section>`).join('')}</div>`}function advanceDeal(id){const stages=['Novo','Em contato','Qualificado','Proposta','Concluído'],d=db.deals.find(x=>x.id===id);d.stage=stages[Math.min(stages.indexOf(d.stage)+1,4)];save();render();toast('Oportunidade atualizada')}
function inbox(){return `<div class="page-head"><div><h1>Atendimentos</h1><p>Fila omnicanal para conversa, distribuição e acompanhamento.</p></div><button class="primary" onclick="openForm('contact')">+ Iniciar atendimento</button></div><section class="panel chat-layout"><div class="chat-list">${db.contacts.length?db.contacts.map((c,i)=>`<div class="conversation ${i===0?'active':''}"><strong>${esc(c.name)}</strong><span>Sem mensagens nesta demonstração</span></div>`).join(''):empty('conversa','contact')}</div><div class="chat-window"><div class="chat-top">Selecione um contato para começar</div><div class="messages"><div><div class="empty-ico">▱</div>As conversas aparecerão aqui quando um canal for conectado.</div></div><div class="composer"><input disabled placeholder="Conecte um canal para enviar mensagens"><button class="primary" disabled>Enviar</button></div></div></section>`}
function internal(){return `<div class="page-head"><div><h1>Chat interno</h1><p>Comunicação rápida entre equipes, sem misturar clientes.</p></div><button class="primary" onclick="toast('Crie equipes em Configurações para iniciar um canal interno')">+ Novo canal</button></div><section class="panel chat-layout"><div class="chat-list"><div class="conversation active"><strong>Geral</strong><span>Canal padrão da equipe</span></div></div><div class="chat-window"><div class="chat-top"># Geral</div><div class="messages">Ainda não há mensagens internas.</div><div class="composer"><input id="internalMessage" placeholder="Escreva uma mensagem para a equipe"><button class="primary" onclick="sendInternal()">Enviar</button></div></div></section>`}function sendInternal(){const i=document.querySelector('#internalMessage');if(i.value.trim()){i.value='';toast('Mensagem registrada nesta sessão') }}
function reports(){return `<div class="page-head"><div><h1>Relatórios</h1><p>Gere análises operacionais a partir dos dados do seu ambiente.</p></div><button class="primary" data-action="export">Exportar dados</button></div><div class="two-col"><section class="panel"><div class="panel-title">Relatórios disponíveis</div><div class="stack">${['Resumo de atendimentos','Produtividade da equipe','Volume por canal','Tickets e SLAs'].map(x=>`<div class="agent"><div class="mark" style="width:28px;height:28px;font-size:13px">◔</div><div class="agent-info"><strong>${x}</strong><span>Gere quando houver registros</span></div><button class="outline-btn" onclick="toast('Ainda não existem dados para este relatório')">Abrir</button></div>`).join('')}</div></section><section class="panel"><div class="panel-title">Período</div><div class="field"><label>Intervalo da análise</label><select><option>Este mês</option><option>Últimos 7 dias</option><option>Hoje</option></select></div><div class="empty" style="padding-top:70px">Os gráficos serão preenchidos conforme a operação acumular dados.</div></section></div>`}
function settings(){return `<div class="page-head"><div><h1>Configurações</h1><p>Defina a base operacional do seu ambiente.</p></div></div><div class="two-col"><section class="panel"><div class="panel-title">Canais de atendimento</div><div class="stack">${['WhatsApp','Instagram','E-mail','Telefone'].map(x=>`<div class="agent"><div class="mark" style="width:28px;height:28px;font-size:13px">+</div><div class="agent-info"><strong>${x}</strong><span>Não conectado</span></div><button class="outline-btn" onclick="toast('A integração exige credenciais próprias e será configurada em uma etapa segura.')">Conectar</button></div>`).join('')}</div></section><section class="panel"><div class="panel-title">Organização</div><div class="field"><label>Nome exibido</label><input value="Fluxo Central"></div><div class="field" style="margin-top:14px"><label>Fuso horário</label><select><option>America/Sao_Paulo</option></select></div><button class="primary" style="margin-top:18px" onclick="toast('Preferências salvas neste navegador')">Salvar preferências</button></section></div>`}
function render(){document.querySelector('#crumb').textContent=pageNames[current];document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));document.querySelector('#content').innerHTML=({dashboard,agents,crm,tickets,inbox,internal,contacts,reports,settings})[current]();document.querySelector('#newAction').textContent=current==='contacts'?'+ Novo contato':current==='tickets'?'+ Novo ticket':current==='crm'?'+ Nova oportunidade':current==='agents'?'+ Adicionar agente':'+ Novo';}
function openForm(type){const forms={contact:{title:'Novo contato',fields:`<div class="form-grid"><div class="field"><label>Nome *</label><input required name="name" autofocus></div><div class="field"><label>Telefone</label><input name="phone"></div><div class="field"><label>E-mail</label><input type="email" name="email"></div><div class="field"><label>Canal de origem</label><select name="channel"><option>Manual</option><option>WhatsApp</option><option>Instagram</option><option>Website</option></select></div></div>`},ticket:{title:'Novo ticket',fields:`<div class="form-grid"><div class="field full"><label>Assunto *</label><input required name="subject"></div><div class="field"><label>Solicitante *</label><input required name="requester"></div><div class="field"><label>Prioridade</label><select name="priority"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></div><div class="field full"><label>Descrição</label><textarea name="description" rows="3"></textarea></div></div>`},deal:{title:'Nova oportunidade',fields:`<div class="form-grid"><div class="field"><label>Nome *</label><input required name="name"></div><div class="field"><label>Empresa</label><input name="company"></div><div class="field"><label>Etapa</label><select name="stage"><option>Novo</option><option>Em contato</option><option>Qualificado</option><option>Proposta</option></select></div></div>`},agent:{title:'Adicionar agente',fields:`<div class="form-grid"><div class="field"><label>Nome *</label><input required name="name"></div><div class="field"><label>Função</label><input name="role" value="Atendimento"></div><div class="field full"><label>E-mail corporativo</label><input name="email" type="email"></div></div>`}}[type];document.querySelector('#modalTitle').textContent=forms.title;document.querySelector('#modalForm').innerHTML=forms.fields+`<div class="modal-foot"><button type="button" class="outline-btn" onclick="closeModal()">Cancelar</button><button class="primary">Salvar</button></div>`;document.querySelector('#modalForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.id=crypto.randomUUID();x.date=new Date().toLocaleDateString('pt-BR');if(type==='contact')db.contacts.push(x);if(type==='ticket'){x.status='Aberto';db.tickets.push(x)}if(type==='deal')db.deals.push(x);if(type==='agent')db.agents.push(x);save();closeModal();render();toast('Registro salvo com sucesso')};document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}document.querySelector('#modalClose').onclick=closeModal;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});document.querySelector('#newAction').onclick=()=>openForm(({contacts:'contact',tickets:'ticket',crm:'deal',agents:'agent'})[current]||'contact');document.addEventListener('click',e=>{if(e.target.dataset.action==='export')toast('Exportação disponível quando houver dados cadastrados.')});render();
</script>
<script>
/* Dashboard reconstruído a partir da composição observada: filtros, seis indicadores,
   dois gráficos e a grade operacional. Não utiliza dados ou código de terceiros. */
dashboard=()=>`<div class="page-head compact-head"><div><h1>Painel e indicadores</h1><p>Visão operacional dos atendimentos da sua equipe.</p></div><div class="filters"><div class="filter-block"><label>Fila</label><select><option>Todas</option></select></div><div class="filter-block"><label>Período</label><select><option>Hoje</option><option>Últimos 7 dias</option><option>Este mês</option></select></div><button class="outline-btn" onclick="render()">↻ Atualizar</button></div></div><div class="cards dashboard-cards"><div class="card"><div class="label">Atendimentos</div><div class="value">0</div><div class="trend">Sem variação</div></div><div class="card"><div class="label">Clientes únicos</div><div class="value">${db.contacts.length}</div><div class="trend">Base própria</div></div><div class="card"><div class="label">Mensagens enviadas</div><div class="value">0</div><div class="trend">Aguardando canal</div></div><div class="card"><div class="label">Mensagens recebidas</div><div class="value">0</div><div class="trend">Aguardando canal</div></div><div class="card"><div class="label">Méd. atend. / agente</div><div class="value">—</div><div class="trend">Sem equipe em operação</div></div><div class="card"><div class="label">TMA</div><div class="value small-value">00:00:00</div><div class="trend">Tempo médio de atendimento</div></div></div><div class="grid2 dashboard-grid"><section class="panel"><div class="panel-title"><span><button class="chart-tab active">Contatos por hora</button><button class="chart-tab">Contatos por dia do mês</button></span><span>Chats · Chamadas · Abandonadas</span></div><div class="hour-chart">${Array.from({length:24},(_,i)=>`<div class="hour-col"><div class="hour-stack"><i style="height:${i>7&&i<19?Math.max(4,(i*7)%66):2}px"></i></div><small>${String(i).padStart(2,'0')}h</small></div>`).join('')}</div></section><section class="panel"><div class="panel-title"><span><button class="chart-tab active">Atendimentos por fila</button><button class="chart-tab">Por canal</button></span></div><div class="queue-chart">${['Fila 1','Fila 2','Fila 3','Fila 4','Fila 5','Fila 6'].map((x,i)=>`<div><span>${x}</span><b style="width:${[12,9,7,5,3,2][i]}%"></b><em>0</em></div>`).join('')}</div></section></div><section class="panel" style="margin-top:16px"><div class="panel-title">Desempenho por agente <span>Atualizado por período e fila</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Agente</th><th>Atendimentos</th><th>Dias</th><th>Méd. atend. / dia</th><th>Msg. enviadas</th><th>Msg. recebidas</th><th>TMA</th></tr></thead><tbody>${db.agents.length?db.agents.map(a=>`<tr><td><strong>${esc(a.name)}</strong></td><td>0</td><td>0</td><td>—</td><td>0</td><td>0</td><td>00:00:00</td></tr>`).join(''):`<tr><td colspan="7">${empty('agente','agent')}</td></tr>`}</tbody></table></div></section>`;
pageNames.dashboard='Painel e indicadores';
render();
</script>

<thead><tr><th>Agente</th><th>Atendimentos</th><th>Dias</th><th>Méd. atend. / Dia</th><th>Msg. Enviadas</th><th>Msg. Recebidas</th><th>TMA</th></tr></thead><tbody>${db.agents.length?db.agents.map(a=>`<tr><td>${esc(a.name)}</td><td>0</td><td>0</td><td>—</td><td>0</td><td>0</td><td>00:00:00</td></tr>`).join(''):`<tr><td colspan="7" class="att-empty">Nenhum agente ou atendimento neste ambiente.</td></tr>`}</tbody></table></div></section><section class="att-card pie-card second-pie"><div class="card-tabs"><button class="active">Atend. por filtro da URA</button><button>Atend. por fechamento</button></div><div class="pie-body"><div class="pie empty-pie"></div><div class="pie-legend"><div><i></i>Sem filtro</div><div><i></i>Atendimento</div><small>Sem registros ainda</small></div></div></section></div></section>`;

<script>
const apiUrl=()=>localStorage.getItem('fc.apiUrl')||'';
async function checkIntegration(){const status=document.querySelector('#zapiStatus');if(!apiUrl()){status.textContent='Informe a URL do backend para verificar a integração.';return}status.textContent='Verificando…';try{const r=await fetch(`${apiUrl().replace(/\/$/,'')}/health`);const v=await r.json();status.textContent=v.integration?.configured?'Z-API configurada e pronta para receber mensagens.':'Backend acessível, mas a Z-API ainda não foi configurada.'}catch{status.textContent='Não foi possível acessar o backend. Confira a URL e se ele está publicado.'}}
function saveApiUrl(){const v=document.querySelector('#apiUrl').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(v)){toast('Use uma URL HTTPS do seu backend.');return}localStorage.setItem('fc.apiUrl',v);toast('URL do backend salva neste navegador.');checkIntegration()}
settings=()=>`<div class="page-head"><div><h1>Integrações</h1><p>Conecte seus próprios canais, sem compartilhar credenciais com o GitHub.</p></div></div><div class="two-col"><section class="panel"><div class="panel-title">WhatsApp — Z-API <span class="badge amber">Aguardando conexão</span></div><p style="color:var(--muted);line-height:1.55">A Z-API conecta o seu número via QR Code e entrega mensagens ao backend do Fluxo Central por webhook.</p><ol style="padding-left:20px;color:#526071;line-height:1.8"><li>Crie uma instância Z-API.</li><li>Leia o QR Code com o número que será usado.</li><li>Publique este backend e configure as credenciais somente nele.</li><li>Cadastre a URL <code>/webhooks/zapi</code> no painel Z-API.</li></ol><button class="primary" onclick="checkIntegration()">Verificar conexão</button><p id="zapiStatus" style="margin:14px 0 0;color:#60706a;font-size:12px"></p></section><section class="panel"><div class="panel-title">Backend do Fluxo Central</div><div class="field"><label>URL pública do backend</label><input id="apiUrl" placeholder="https://api.seudominio.com" value="${esc(apiUrl())}"></div><p style="color:var(--muted);font-size:12px;line-height:1.5">Esta URL é segura para guardar no navegador. Tokens Z-API devem ficar somente como variáveis de ambiente no servidor.</p><button class="primary" onclick="saveApiUrl()">Salvar e testar</button></section></div>`;
